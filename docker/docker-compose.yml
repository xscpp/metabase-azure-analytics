services:
  metabase-db:
    image: postgres:15-alpine
    container_name: metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MB_DB_USER}
      POSTGRES_PASSWORD: ${MB_DB_PASS}
      POSTGRES_DB: ${MB_DB_NAME}
    volumes:
      - ${DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER} -d ${MB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metabase-net

  metabase:
    image: metabase/metabase:v0.50.20
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: ${MB_SITE_URL:-}
      JAVA_TIMEZONE: ${TIMEZONE:-UTC}
    depends_on:
      metabase-db:
        condition: service_healthy
    volumes:
      - ${DATA_PATH:-./data}/metabase-plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - metabase-net

networks:
  metabase-net:
    driver: bridge
